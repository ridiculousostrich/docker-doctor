services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - NETWORKS=1
      - IMAGES=1
      - PING=1
      - VERSION=1
      - POST=0          # Block write operations
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - doctor-internal

  docker-doctor:
    build:
      context: .
      args:
        AI_PROVIDER: ollama
    image: ridiculousostrich/docker-doctor:v2.1
    container_name: docker-doctor
    restart: unless-stopped
    depends_on:
      - socket-proxy
    ports:
      - "8586:8586"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - docker-doctor-data:/app/data
    environment:
      - TZ=America/New_York
      - DOCKER_HOST=tcp://socket-proxy:2375
    networks:
      - doctor-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8586/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  doctor-internal:
    internal: true

volumes:
  docker-doctor-data:
