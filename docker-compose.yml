version: '3.8'

services:
  docker-doctor:
    build:
      context: .
      args:
        AI_PROVIDER: ollama
    container_name: docker-doctor
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/docker-doctor/config.yaml:/app/config.yaml:ro
      - docker-doctor-data:/app/data

    ports:
      - "8585:8585"
      - "8586:8586"

    environment:
      - TZ=America/New_York

    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  docker-doctor-data:
